name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --frozen --python 3.12
      - name: Lint
        run: uv run ruff check app tests
      - name: Type check
        run: uv run mypy app
      - name: Test
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: Audit dependencies
        continue-on-error: true
        run: uv run --with pip-audit pip-audit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --audit-level=high
