[project]
name = "chatapi-backend"
version = "1.0.0"
description = "FastAPI backend for ChatAPI — embeddable AI chat grounded in business documents."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0,<2.1",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "nanoid>=2.0.0",
    "email-validator>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.9",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "uploads"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["\\.venv/"]

[[tool.mypy.overrides]]
module = ["nanoid", "docx", "pypdf", "jose"]
ignore_missing_imports = true
